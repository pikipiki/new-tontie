sonar.projectKey=tontie-re
sonar.projectName=tontie-re
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src,tests,e2e
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx,tests/e2e/**/*.test.ts,e2e/**/*.spec.ts
sonar.exclusions=**/node_modules/**,dist/**,reference/**,public/**,.cache/**,coverage/**,**/__tests__/**,scripts/**
sonar.coverage.exclusions=**/__tests__/**
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
