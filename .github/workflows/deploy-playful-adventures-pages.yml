# Publishes codex/playful-adventures to a separate GitHub Pages repo (own *.github.io URL).
# One-time: docs/DEPLOY-FREE.md — deploy key + Pages on pikipiki/new-tontie-playful-adventures
name: Deploy playful-adventures (external Pages)

on:
  push:
    branches: [codex/playful-adventures]
  workflow_dispatch:

concurrency:
  group: playful-adventures-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Push dist to Pages repo
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.PLAYFUL_ADVENTURES_PAGES_DEPLOY_KEY }}
          external_repository: pikipiki/new-tontie-playful-adventures
          publish_branch: gh-pages
          publish_dir: dist
          commit_message: 'deploy: ${{ github.sha }}'
