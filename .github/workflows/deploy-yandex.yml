# Optional RU mirror — requires repository secrets (see docs/DEPLOY-RU.md).
name: Deploy Yandex (RU)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.YC_S3_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          aws-region: ru-central1

      - name: Sync to Yandex Object Storage
        env:
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
        run: |
          aws --endpoint-url="$YC_S3_ENDPOINT" s3 sync dist/ "s3://${YC_S3_BUCKET}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws --endpoint-url="$YC_S3_ENDPOINT" s3 cp dist/index.html "s3://${YC_S3_BUCKET}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8"
