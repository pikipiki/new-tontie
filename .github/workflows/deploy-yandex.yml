# Optional RU mirror — requires repository secrets (see docs/DEPLOY-RU.md).
name: Deploy Yandex (RU)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.YC_S3_BUCKET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to Yandex Object Storage
        env:
          YC_S3_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          YC_S3_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          YC_S3_BUCKET: ${{ secrets.YC_S3_BUCKET }}
          YC_S3_ENDPOINT: https://storage.yandexcloud.net
          YC_S3_REGION: ru-central1
        run: node scripts/deploy-yandex-storage.mjs --skip-build
